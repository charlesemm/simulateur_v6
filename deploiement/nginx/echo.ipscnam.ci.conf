# Vhost nginx pour ECHO v6 — a deposer dans /etc/nginx/conf.d/ sur srv-gouv.
#
# Il REMPLACE le vhost de la v5, dont il reprend toutes les conventions :
# meme TLS (wildcard *.ipscnam.ci), memes en-tetes de relais, journaux
# separes, pas de default_server.
#
# ── Installation ──────────────────────────────────────────────────────────
#   sudo cp /etc/nginx/conf.d/echo.ipscnam.ci.conf ~/echo-v5-vhost.conf.sauvegarde
#   sudo cp deploiement/nginx/echo.ipscnam.ci.conf /etc/nginx/conf.d/
#   sudo nginx -t                    # valide la syntaxe AVANT de recharger
#   sudo systemctl reload nginx      # reload, pas restart : ne coupe pas Socle
#
# Retour a la v5 : remettre le fichier sauvegarde, nginx -t, reload.
#
# ── Les trois differences avec le vhost de la v5 ─────────────────────────
#
#   1. LE PORT : 8088 au lieu de 8087. La v5 garde le 8087 et reste
#      demarrable pendant toute la bascule. Changer ce seul numero suffit a
#      basculer d'une version a l'autre.
#
#   2. LE CHEMIN : l'application vit sous /simulateur (context-path fixe dans
#      application.yml, et toutes les URL Thymeleaf en dependent). La racine
#      du domaine redirige donc vers /simulateur/, pour que
#      https://echo.ipscnam.ci reste l'adresse que les gens tapent.
#
#   3. LA CSP : la v6 ne charge AUCUNE ressource externe — htmx et Chart.js
#      sont figes dans static/js/vendor, IBM Plex est servi depuis
#      static/fonts. Plus de fonts.googleapis.com, plus de wss:// : le temps
#      reel passe par du SSE (une requete HTTP qui reste ouverte), pas par
#      une WebSocket. La table $connection_upgrade de la v5 n'a plus d'objet.

server {
    listen 80;
    listen [::]:80;
    server_name echo.ipscnam.ci;

    # Rien ne se sert en clair : tout remonte en HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # « listen ... http2 » est la seule syntaxe valide en nginx 1.14 (Oracle
    # Linux 8). Ne pas « corriger » vers « http2 on; », qui ferait echouer le
    # demarrage — et couperait Socle avec.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name echo.ipscnam.ci;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    ssl_certificate     /etc/ssl/certs/nginx.pem;
    ssl_certificate_key /etc/ssl/certs/nginx.key;

    # Pas de « default_server » : un seul vhost peut l'etre, et se l'attribuer
    # ferait d'Echo la destination de tout trafic dont le nom ne correspond a
    # personne.

    client_max_body_size 10M;
    server_tokens off;

    access_log /var/log/nginx/echo.access.log;
    error_log  /var/log/nginx/echo.error.log;

    # ── Les en-tetes de securite ─────────────────────────────────────────
    # « always » est indispensable : sans lui, nginx ne les pose pas sur les
    # reponses d'erreur (4xx, 5xx), qui sont precisement celles qu'un
    # attaquant cherche a provoquer.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'self' partout, et rien d'autre : la v6 ne charge aucune ressource
    # externe. 'unsafe-inline' sur les styles reste necessaire (attributs
    # style: poses par htmx et par les traces SVG des tuiles).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript
               application/xml image/svg+xml;
    # Pas de gzip sur le flux SSE : nginx attendrait d'avoir de quoi
    # compresser avant d'emettre, ce qui retiendrait les evenements.

    # ── La racine renvoie vers l'application ─────────────────────────────
    # L'application vit sous /simulateur. Quelqu'un qui tape le domaine seul
    # doit arriver sur la page de connexion, pas sur une erreur 404.
    location = / {
        return 301 https://$host/simulateur/;
    }

    # ── Le flux temps reel (SSE) ─────────────────────────────────────────
    # DOIT venir avant « location /simulateur/ » : nginx choisit l'emplacement
    # le plus specifique, mais « = » et « ^~ » seuls court-circuitent les
    # expressions regulieres. Ici les deux sont des prefixes, donc le plus
    # long gagne — celui-ci.
    #
    # Sans « proxy_buffering off », nginx retiendrait les evenements jusqu'a
    # remplir son tampon : le tableau de bord ne se mettrait jamais a jour.
    # SseController envoie deja « X-Accel-Buffering: no », mais cette ligne
    # est la ceinture.
    location /simulateur/flux {
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Prefix /simulateur;

        proxy_buffering    off;
        proxy_cache        off;
        # Le flux reste ouvert entre deux messages : sans ce delai long,
        # nginx le couperait toutes les 60 secondes.
        proxy_read_timeout 1h;
    }

    location /simulateur/ {
        # Le port 8088 n'est publie QUE sur la boucle locale par
        # compose.prod.yaml : rien sur le reseau ne joint l'application
        # directement.
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        # Spring lit cet en-tete grace a forward-headers-strategy: framework.
        # Sans lui, les redirections reparteraient en http:// et la connexion
        # echouerait derriere le HTTPS.
        proxy_set_header X-Forwarded-Prefix /simulateur;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        # Un export CSV (plafonne a 100 000 lignes) depasse les 60 s par defaut.
        proxy_read_timeout    120s;
    }
}
