<!DOCTYPE html>
<!--/* Gabarit commun. Chaque page : <html th:replace="~{layout :: page(~{::title}, ~{::main})}"> */-->
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(titre, contenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" th:content="${_csrf?.token}" content="">
    <meta name="csrf-header" th:content="${_csrf?.headerName}" content="X-CSRF-TOKEN">
    <!-- htmx : pas d'évaluation de code ni de scripts reçus dans les réponses -->
    <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
    <title th:replace="${titre}">Echo</title>
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/vendor/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<th:block th:replace="~{icones :: sprite}"></th:block>
<a class="saut" href="#contenu">Aller au contenu</a>

<div class="coquille">
    <nav class="rail" aria-label="Navigation principale">
        <a class="marque" th:href="@{/dashboard}">
            <span class="sceau" aria-hidden="true"><svg class="ico"><use href="#i-activity"/></svg></span>
            <b>Echo</b>
        </a>

        <p class="groupe">Pilotage</p>
        <a class="destination" th:href="@{/dashboard}">
            <svg class="ico" aria-hidden="true"><use href="#i-dashboard"/></svg><span class="libelle">Tableau de bord</span></a>
        <a class="destination" th:href="@{/lancement}">
            <svg class="ico" aria-hidden="true"><use href="#i-play"/></svg><span class="libelle">Lancement</span></a>
        <a class="destination chaude" th:href="@{/chaos}">
            <svg class="ico" aria-hidden="true"><use href="#i-zap"/></svg><span class="libelle">Crash tests</span></a>

        <p class="groupe">Données</p>
        <a class="destination" th:href="@{/evenements}">
            <svg class="ico" aria-hidden="true"><use href="#i-dossier"/></svg><span class="libelle">Flux de données</span></a>
        <a class="destination" th:href="@{/qualite}">
            <svg class="ico" aria-hidden="true"><use href="#i-shield"/></svg><span class="libelle">Qualité</span></a>
        <a class="destination" th:href="@{/historique}">
            <svg class="ico" aria-hidden="true"><use href="#i-clock"/></svg><span class="libelle">Simulations passées</span></a>
        <a class="destination" th:href="@{/scenarios}">
            <svg class="ico" aria-hidden="true"><use href="#i-file"/></svg><span class="libelle">Scénarios</span></a>

        <div class="rail-bas">
            <a class="destination" th:href="@{/admin/utilisateurs}" sec:authorize="hasRole('ADMIN')">
                <svg class="ico" aria-hidden="true"><use href="#i-users"/></svg><span class="libelle">Administration</span></a>
            <button type="button" class="discrete replier" data-replier-rail aria-pressed="false">
                <svg class="ico pivote" aria-hidden="true"><use href="#i-chevron-gauche"/></svg><span class="libelle">Replier le rail</span>
            </button>
        </div>
    </nav>

    <div>
        <header class="entete">
            <!--/* Fil renseigné côté navigateur à partir de la destination courante du rail. */-->
            <span class="fil" data-fil></span>

            <button type="button" class="recherche" data-recherche aria-label="Rechercher (Ctrl+K)">
                <svg class="ico" aria-hidden="true"><use href="#i-recherche"/></svg>
                <span class="etiquette">Rechercher une simulation, un scénario…</span>
                <kbd>Ctrl</kbd><kbd>K</kbd>
            </button>

            <div class="compte">
                <button type="button" class="secondaire icone-seule" data-bascule-theme>
                    <svg class="ico t-auto" aria-hidden="true"><use href="#i-monitor"/></svg>
                    <svg class="ico t-light" aria-hidden="true"><use href="#i-sun"/></svg>
                    <svg class="ico t-dark" aria-hidden="true"><use href="#i-moon"/></svg>
                </button>
                <a th:href="@{/mot-de-passe}" class="jeton" title="Mon compte et mot de passe">
                    <svg class="ico" aria-hidden="true"><use href="#i-user"/></svg>
                    <span class="hors-ecran" sec:authentication="name">utilisateur</span>
                </a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="secondaire" title="Se déconnecter">
                        <svg class="ico" aria-hidden="true"><use href="#i-logout"/></svg><span class="cache-mobile">Déconnexion</span>
                    </button>
                </form>
            </div>
        </header>

        <main th:replace="${contenu}">
            Contenu
        </main>
    </div>
</div>

<nav class="basse" aria-label="Navigation">
    <a th:href="@{/dashboard}"><svg class="ico" aria-hidden="true"><use href="#i-dashboard"/></svg>Bord</a>
    <a th:href="@{/lancement}"><svg class="ico" aria-hidden="true"><use href="#i-play"/></svg>Lancer</a>
    <a th:href="@{/chaos}"><svg class="ico" aria-hidden="true"><use href="#i-zap"/></svg>Pannes</a>
    <a th:href="@{/evenements}"><svg class="ico" aria-hidden="true"><use href="#i-activity"/></svg>Flux</a>
    <a th:href="@{/qualite}"><svg class="ico" aria-hidden="true"><use href="#i-shield"/></svg>Qualité</a>
</nav>
</body>
</html>
