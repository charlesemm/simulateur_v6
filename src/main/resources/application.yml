# Configuration de l'application. Aucun secret ici : tout vient de variables d'environnement (.env).
# DB_USER et DB_PASSWORD n'ont volontairement pas de valeur par defaut : l'application refuse de demarrer sans elles.

server:
  port: 8080
  servlet:
    context-path: /simulateur          # hebergement futur sous un chemin, derriere un reverse proxy
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}   # true en production (HTTPS)
  forward-headers-strategy: framework  # lit X-Forwarded-* envoyes par le reverse proxy
  shutdown: graceful

spring:
  application:
    name: simulateur-flux-cnam
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # En conteneur : jdbc:postgresql://toxiproxy:5432/... (jamais en direct, pour pouvoir couper la liaison)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/simulateur?reWriteBatchedInserts=true}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000         # ms : echoue vite quand la liaison est coupee
      validation-timeout: 3000
      max-lifetime: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate               # la base n'est creee que par Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  web:
    resources:
      cache:
        period: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: simulateur

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Reglages propres au simulateur
simulateur:
  graine-par-defaut: 42                # toute generation aleatoire passe par SeededRandom
  scenarios-dir: ${SCENARIOS_DIR:scenarios}
  securite:
    cle-api: ${API_KEY}                # stockee hachee en base des le prompt 'securite'
    mot-de-passe-admin-initial: ${ADMIN_INITIAL_PASSWORD}
    echecs-avant-verrouillage: 5
  toxiproxy:
    url: ${TOXIPROXY_URL:http://localhost:8474}
    proxy: postgres
  ecriture:
    taille-lot: 500
    file-attente-max: 10000            # au-dela : contre-pression, jamais de perte silencieuse

# Referentiel synthetique (rempli au demarrage seulement si la table assure est vide)
simulator:
  reference:
    nb-assures: ${REFERENCE_NB_ASSURES:50000}
    seed: ${REFERENCE_SEED:42}
  # Parcours d'une prestation : voies apres la consultation (somme = 1). Valeurs de depart, a fixer par les directions metier.
  parcours:
    proba-examens: 0.60
    proba-hospitalisation: 0.10
    proba-direct: 0.30
